name: Install Test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v1.2.2; defaults to latest)'
        required: false
        default: ''

jobs:
  resolve-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Determine target release tag
        id: get-tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            REDIRECT_URL="$(curl -fssIL -o /dev/null -w '%{url_effective}' "https://github.com/Octo-sh/Octo-CLI/releases/latest" 2>/dev/null || true)"
            TAG="$(basename "$REDIRECT_URL" 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            TAG="$(curl -fsSL "https://api.github.com/repos/Octo-sh/Octo-CLI/releases/latest" 2>/dev/null | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: Unable to resolve release tag" >&2
            exit 1
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  matrix-test:
    name: Script Install (${{ matrix.os }})
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, ubuntu-latest, windows-latest]
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      OCTO_VERSION: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Install and verify on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/Octo-sh/Octo-CLI/main/install.sh | sh
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
          VERSION_OUTPUT="$(octo --version)"
          echo "octo --version output: $VERSION_OUTPUT"
          TAG_CLEAN="${TAG#v}"
          if [[ "$VERSION_OUTPUT" != *"$TAG"* && "$VERSION_OUTPUT" != *"$TAG_CLEAN"* ]]; then
            echo "Error: Version mismatch! Expected '$TAG' (or '$TAG_CLEAN'), got: '$VERSION_OUTPUT'" >&2
            exit 1
          fi

      - name: Install and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/Octo-sh/Octo-CLI/main/install.ps1 | iex
          $octoInstallDir = "$env:LOCALAPPDATA\Programs\octo"
          $env:Path = "$octoInstallDir;$env:Path"
          echo "$octoInstallDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $versionOutput = octo --version
          Write-Host "octo --version output: $versionOutput"
          $cleanTag = $env:TAG.TrimStart('v')
          if ($versionOutput -notmatch [regex]::Escape($env:TAG) -and $versionOutput -notmatch [regex]::Escape($cleanTag)) {
              Write-Error "Error: Version mismatch! Expected '$($env:TAG)' (or '$cleanTag'), got: '$versionOutput'"
              exit 1
          }

  brew-test:
    name: Homebrew Install (macos-latest)
    needs: resolve-tag
    runs-on: macos-latest
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Tap repository, install octo, and verify version
        run: |
          brew tap Octo-sh/tap && brew install octo && octo --version
          VERSION_OUTPUT="$(octo --version)"
          echo "octo --version output: $VERSION_OUTPUT"
          TAG_CLEAN="${TAG#v}"
          if [[ "$VERSION_OUTPUT" != *"$TAG"* && "$VERSION_OUTPUT" != *"$TAG_CLEAN"* ]]; then
            echo "Error: Version mismatch! Expected '$TAG' (or '$TAG_CLEAN'), got: '$VERSION_OUTPUT'" >&2
            exit 1
          fi

  scoop-test:
    name: Scoop Install (windows-latest)
    needs: resolve-tag
    runs-on: windows-latest
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Install via Scoop manifest URL and verify version
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
              Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
              irm get.scoop.sh | iex
              $scoopShim = Join-Path $env:USERPROFILE "scoop\shims"
              $env:Path = "$scoopShim;$env:Path"
              echo "$scoopShim" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          scoop install https://raw.githubusercontent.com/Octo-sh/Octo-CLI/main/bucket/octo.json
          $versionOutput = octo --version
          Write-Host "octo --version output: $versionOutput"
          $cleanTag = $env:TAG.TrimStart('v')
          if ($versionOutput -notmatch [regex]::Escape($env:TAG) -and $versionOutput -notmatch [regex]::Escape($cleanTag)) {
              Write-Error "Error: Version mismatch! Expected '$($env:TAG)' (or '$cleanTag'), got: '$versionOutput'"
              exit 1
          }
