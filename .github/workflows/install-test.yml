name: Install Test

# Events created with GITHUB_TOKEN (such as a release published by the Release
# workflow) do not start new workflow runs, so a `release: published` trigger
# never fires for our own releases. Instead we use:
#   - workflow_run: starts after the Release workflow completes successfully
#   - workflow_dispatch: manual run with an explicit tag
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v1.2.3). Required.'
        required: true

jobs:
  resolve-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Determine target release tag
        id: get-tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # workflow_run: the Release workflow runs on the tag ref
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "Error: '$TAG' is not a release tag (expected vX.Y.Z)" >&2
              exit 1
              ;;
          esac
          if ! curl -fsSLI -o /dev/null "https://github.com/Octo-sh/Octo-CLI/releases/tag/$TAG"; then
            echo "Error: release $TAG does not exist" >&2
            exit 1
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  matrix-test:
    name: Script Install (${{ matrix.os }})
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon
          - os: macos-15-intel # Intel
          - os: ubuntu-latest
          - os: windows-latest
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      OCTO_VERSION: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Install and verify on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/Octo-sh/Octo-CLI/main/install.sh | sh
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
          VERSION_OUTPUT="$(octo --version)"
          echo "octo --version output: $VERSION_OUTPUT"
          TAG_CLEAN="${TAG#v}"
          if [[ "$VERSION_OUTPUT" != *"$TAG"* && "$VERSION_OUTPUT" != *"$TAG_CLEAN"* ]]; then
            echo "Error: Version mismatch! Expected '$TAG' (or '$TAG_CLEAN'), got: '$VERSION_OUTPUT'" >&2
            exit 1
          fi

      - name: Install and verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/Octo-sh/Octo-CLI/main/install.ps1 | iex
          $octoInstallDir = "$env:LOCALAPPDATA\Programs\octo"
          $env:Path = "$octoInstallDir;$env:Path"
          echo "$octoInstallDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $versionOutput = octo --version
          Write-Host "octo --version output: $versionOutput"
          $cleanTag = $env:TAG.TrimStart('v')
          if ($versionOutput -notmatch [regex]::Escape($env:TAG) -and $versionOutput -notmatch [regex]::Escape($cleanTag)) {
              Write-Error "Error: Version mismatch! Expected '$($env:TAG)' (or '$cleanTag'), got: '$versionOutput'"
              exit 1
          }

  brew-test:
    name: Homebrew Install (macos-latest)
    needs: resolve-tag
    runs-on: macos-latest
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Tap repository, install octo, and verify version
        run: |
          brew tap Octo-sh/tap
          FORMULA_VERSION="$(brew info --json=v1 Octo-sh/tap/octo | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["versions"]["stable"])')"
          if [ "v$FORMULA_VERSION" != "$TAG" ] && [ "$FORMULA_VERSION" != "$TAG" ]; then
            echo "Error: tap formula is at $FORMULA_VERSION, expected $TAG. Bump the tap first." >&2
            exit 1
          fi
          brew install Octo-sh/tap/octo
          VERSION_OUTPUT="$(octo --version)"
          echo "octo --version output: $VERSION_OUTPUT"
          TAG_CLEAN="${TAG#v}"
          if [[ "$VERSION_OUTPUT" != *"$TAG"* && "$VERSION_OUTPUT" != *"$TAG_CLEAN"* ]]; then
            echo "Error: Version mismatch! Expected '$TAG' (or '$TAG_CLEAN'), got: '$VERSION_OUTPUT'" >&2
            exit 1
          fi

  scoop-test:
    name: Scoop Install (windows-latest)
    needs: resolve-tag
    runs-on: windows-latest
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Install via Scoop manifest URL and verify version
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
              Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
              irm get.scoop.sh | iex
              $scoopShim = Join-Path $env:USERPROFILE "scoop\shims"
              $env:Path = "$scoopShim;$env:Path"
              echo "$scoopShim" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $manifestUrl = "https://raw.githubusercontent.com/Octo-sh/Octo-CLI/main/bucket/octo.json"
          $manifest = Invoke-RestMethod $manifestUrl
          if ("v$($manifest.version)" -ne $env:TAG -and $manifest.version -ne $env:TAG) {
              Write-Error "Scoop manifest is at $($manifest.version), expected $($env:TAG). Bump the manifest first."
              exit 1
          }
          scoop install $manifestUrl
          $versionOutput = octo --version
          Write-Host "octo --version output: $versionOutput"
          $cleanTag = $env:TAG.TrimStart('v')
          if ($versionOutput -notmatch [regex]::Escape($env:TAG) -and $versionOutput -notmatch [regex]::Escape($cleanTag)) {
              Write-Error "Error: Version mismatch! Expected '$($env:TAG)' (or '$cleanTag'), got: '$versionOutput'"
              exit 1
          }
